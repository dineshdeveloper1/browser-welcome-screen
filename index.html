<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A personal daily dashboard with world clocks, Charkhi Dadri weather, and a thought for the day.">
  <title>Welcome page by Dinesh</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23101420'/%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%23eab976' stroke-width='2'/%3E%3Cpath d='M16 8v8l5 3' fill='none' stroke='%23eab976' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <section class="weather-panel" aria-labelledby="weather-title">
      <div class="panel-heading"><div><h2 id="weather-title">Charkhi Dadri, Haryana</h2></div></div>
      <div id="weather-data" aria-busy="true">
        <div class="weather-main"><span class="weather-temperature" id="weather-temp">—°C</span><div><p class="weather-condition" id="weather-condition">Loading…</p><p class="weather-feels" id="weather-feels">Feels like —</p></div></div>
      </div>
      <section class="forecast" aria-labelledby="forecast-title"><h3 id="forecast-title">Next 3 days <span class="forecast-low">High / Low</span></h3><ul class="forecast-list" id="weather-forecast"><li class="panel-source">Loading forecast…</li></ul></section>
      <p class="panel-status" id="weather-status" role="status">Checking weather…</p>
    </section>
  <main>
    <section class="clock-panel" aria-label="World clocks">
    <div class="clocks">
      <section class="clock-card" id="india" aria-labelledby="india-title">
        <div class="card-top"><div><h2 class="country-flag" id="india-title" aria-label="India"><span aria-hidden="true">🇮🇳</span></h2><p class="location">New Delhi</p></div><span class="zone">IST</span></div>
        <div class="face" aria-hidden="true"><span class="number" style="left:66.50%;top:21.42%">1</span><span class="number" style="left:78.58%;top:33.50%">2</span><span class="number" style="left:83.00%;top:50.00%">3</span><span class="number" style="left:78.58%;top:66.50%">4</span><span class="number" style="left:66.50%;top:78.58%">5</span><span class="number" style="left:50.00%;top:83.00%">6</span><span class="number" style="left:33.50%;top:78.58%">7</span><span class="number" style="left:21.42%;top:66.50%">8</span><span class="number" style="left:17.00%;top:50.00%">9</span><span class="number" style="left:21.42%;top:33.50%">10</span><span class="number" style="left:33.50%;top:21.42%">11</span><span class="number" style="left:50.00%;top:17.00%">12</span><div class="hand hour"></div><div class="hand minute"></div><div class="hand second"></div><div class="pin"></div></div>
        <div class="digital"><time>--:--:--</time><span class="period"></span></div><div class="offset">UTC +05:30</div>
      </section>
      <section class="clock-card" id="uk" aria-labelledby="uk-title">
        <div class="card-top"><div><h2 class="country-flag" id="uk-title" aria-label="United Kingdom"><span aria-hidden="true">🇬🇧</span></h2><p class="location">London</p></div><span class="zone">UK</span></div>
        <div class="face" aria-hidden="true"><span class="number" style="left:66.50%;top:21.42%">1</span><span class="number" style="left:78.58%;top:33.50%">2</span><span class="number" style="left:83.00%;top:50.00%">3</span><span class="number" style="left:78.58%;top:66.50%">4</span><span class="number" style="left:66.50%;top:78.58%">5</span><span class="number" style="left:50.00%;top:83.00%">6</span><span class="number" style="left:33.50%;top:78.58%">7</span><span class="number" style="left:21.42%;top:66.50%">8</span><span class="number" style="left:17.00%;top:50.00%">9</span><span class="number" style="left:21.42%;top:33.50%">10</span><span class="number" style="left:33.50%;top:21.42%">11</span><span class="number" style="left:50.00%;top:17.00%">12</span><div class="hand hour"></div><div class="hand minute"></div><div class="hand second"></div><div class="pin"></div></div>
        <div class="digital"><time>--:--:--</time><span class="period"></span></div><div class="offset"></div>
      </section>

    </div>
    </section>
    <noscript><p>Please enable JavaScript to display the live clocks and weather.</p></noscript>
  </main>
  <div class="daily-intro">
    <p class="greeting" id="greeting" aria-live="polite" aria-atomic="true"><span class="greeting-icon" id="greeting-icon" aria-hidden="true"></span><span id="greeting-text"></span></p>
    <section class="daily-thought" aria-label="Thought of the day">
    <blockquote id="thought-text">Small steps, taken with care, can lead to meaningful change.</blockquote>
  </section>
  </div>
  <time class="today-date" id="thought-date" aria-label="Today’s date"></time>
  <script>
    const settings = [['india', 'Asia/Kolkata'], ['uk', 'Europe/London']];
    const clocks = settings.map(([id, timeZone]) => {
      const card = document.getElementById(id);
      const face = card.querySelector('.face');
      for (let i = 0; i < 60; i++) {
        const tick = document.createElement('span');
        tick.className = 'tick' + (i % 5 === 0 ? ' major' : '');
        tick.style.setProperty('--angle', `${i * 6}deg`);
        face.prepend(tick);
      }
      return {
        id, card,
        clockFormat: new Intl.DateTimeFormat('en-GB', { timeZone, hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' }),

        offsetFormat: new Intl.DateTimeFormat('en-GB', { timeZone, timeZoneName: 'longOffset' })
      };
    });
    const dailyThoughts = [
      'Small steps, taken with care, can lead to meaningful change.',
      'Give your attention to what you can improve today.',
      'A little patience can make room for a better decision.',
      'Let curiosity turn an ordinary moment into a chance to learn.',
      'Progress begins with the next honest effort.',
      'Make time for the people who make your life feel full.',
      'You do not need a perfect day to do something worthwhile.',
      'Listen closely; understanding often starts in the quiet.',
      'Choose one useful thing, and give it your full attention.',
      'Rest can be part of moving forward.',
      'A kind word can make someone’s day a little lighter.',
      'Notice what is working, even while you work on what is not.',
      'Leave a little room in your plans for something unexpected.',
      'Build a day you can appreciate, one choice at a time.'
    ];
    const thoughtCalendar = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Kolkata', year: 'numeric', month: '2-digit', day: '2-digit' });
    const thoughtDateFormat = new Intl.DateTimeFormat('en-IN', { timeZone: 'Asia/Kolkata', weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    let thoughtDay = '';
    function updateThought(now) {
      const parts = Object.fromEntries(thoughtCalendar.formatToParts(now).map(p => [p.type, p.value]));
      const key = `${parts.year}-${parts.month}-${parts.day}`;
      if (key === thoughtDay) return;
      const dayIndex = Math.floor(Date.UTC(Number(parts.year), Number(parts.month) - 1, Number(parts.day)) / 86400000);
      document.getElementById('thought-text').textContent = dailyThoughts[dayIndex % dailyThoughts.length];
      const date = document.getElementById('thought-date');
      date.textContent = thoughtDateFormat.format(now);
      date.dateTime = key;
      thoughtDay = key;
    }
    const greetingIcons = {
      Morning: '<path d="M3 19h18M5 15a7 7 0 0 1 14 0M12 3v3M3 8l2 2M21 8l-2 2M12 10v6m-3-3 3-3 3 3"/>',
      Afternoon: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"/>',
      Evening: '<path d="M3 19h18M5 15a7 7 0 0 1 14 0M12 3v3M3 8l2 2M21 8l-2 2M12 10v6m-3-3 3 3 3-3"/>',
      Night: '<path d="M20.5 14a8.5 8.5 0 0 1-10.5-10.5A8.5 8.5 0 1 0 20.5 14Z"/><path d="M18 3v4M16 5h4"/>'
    };
    function update() {
      const now = new Date();
      updateThought(now);
      for (const clock of clocks) {
        const parts = Object.fromEntries(clock.clockFormat.formatToParts(now).map(p => [p.type, p.value]));
        const h = Number(parts.hour), m = Number(parts.minute), s = Number(parts.second);
        if (clock.id === 'india') {
          const period = h >= 5 && h < 12 ? 'Morning' : h >= 12 && h < 17 ? 'Afternoon' : h >= 17 && h < 21 ? 'Evening' : 'Night';
          const wallpaperPeriod = period.toLowerCase();
          if (document.body.dataset.period !== wallpaperPeriod) document.body.dataset.period = wallpaperPeriod;
          const greeting = document.getElementById('greeting-text');
          const message = `Good ${period}`;
          if (greeting.textContent !== message) {
            greeting.textContent = message;
            document.getElementById('greeting-icon').innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${greetingIcons[period]}</svg>`;
          }
        }
        const time = clock.card.querySelector('time');
        time.textContent = `${String(h % 12 || 12).padStart(2, '0')}:${parts.minute}:${parts.second}`;
        time.dateTime = now.toISOString();
        clock.card.querySelector('.period').textContent = h >= 12 ? 'PM' : 'AM';
        clock.card.querySelector('.hour').style.transform = `rotate(${h * 30 + m / 2 + s / 120}deg)`;
        clock.card.querySelector('.minute').style.transform = `rotate(${m * 6 + s / 10}deg)`;
        clock.card.querySelector('.second').style.transform = `rotate(${s * 6}deg)`;
        const offset = clock.offsetFormat.formatToParts(now).find(p => p.type === 'timeZoneName').value;
        clock.card.querySelector('.offset').textContent = offset.replace('GMT', 'UTC ') + (offset === 'GMT' ? '+00:00' : '');
        if (clock.id === 'uk') {
          clock.card.querySelector('.zone').textContent = offset === 'GMT+01:00' ? 'BST' : 'GMT';

        }
      }
    }
    update();
    setInterval(update, 1000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) update(); });
  </script>

  <script>
    const weatherEndpoint = 'https://api.open-meteo.com/v1/forecast?latitude=28.59166&longitude=76.27161&current=temperature_2m,apparent_temperature,weather_code&daily=temperature_2m_max,temperature_2m_min,weather_code&timezone=Asia%2FKolkata&forecast_days=4&timeformat=unixtime';
    const weatherStatus = document.getElementById('weather-status');
    const weatherData = document.getElementById('weather-data');
    let weatherLoading = false, weatherChecked = 0, weatherTime = null;
    const weatherTimeFormat = new Intl.DateTimeFormat('en-IN', { timeZone: 'Asia/Kolkata', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
    function weatherDescription(code) {
      if (code === 0) return 'Clear sky';
      if (code === 1) return 'Mostly clear';
      if (code === 2) return 'Partly cloudy';
      if (code === 3) return 'Overcast';
      if ([45, 48].includes(code)) return 'Foggy';
      if ([51, 53, 55].includes(code)) return 'Drizzle';
      if ([56, 57].includes(code)) return 'Freezing drizzle';
      if ([61, 63, 65].includes(code)) return 'Rain';
      if ([66, 67].includes(code)) return 'Freezing rain';
      if ([71, 73, 75, 77].includes(code)) return 'Snow';
      if ([80, 81, 82].includes(code)) return 'Rain showers';
      if ([85, 86].includes(code)) return 'Snow showers';
      if (code === 95) return 'Thunderstorm';
      if ([96, 99].includes(code)) return 'Thunderstorm with hail';
      return 'Conditions unavailable';
    }
    function weatherValue(value, unit) { return typeof value === 'number' && Number.isFinite(value) ? Math.round(value) + unit : '—'; }
    function renderForecast(daily) {
      const list = document.getElementById('weather-forecast');
      const dayFormat = new Intl.DateTimeFormat('en-IN', { timeZone: 'Asia/Kolkata', weekday: 'short', day: 'numeric' });
      const rows = [];
      // Day zero is today; show tomorrow and the following two days.
      for (let i = 1; i <= 3; i++) {
        if (!Number.isFinite(daily?.time?.[i])) continue;
        const row = document.createElement('li');
        row.className = 'forecast-row';
        const day = document.createElement('time');
        const date = new Date(daily.time[i] * 1000);
        day.dateTime = date.toISOString();
        day.textContent = dayFormat.format(date);
        const condition = document.createElement('span');
        condition.className = 'forecast-condition';
        condition.textContent = weatherDescription(daily.weather_code?.[i]);
        const temperatures = document.createElement('span');
        temperatures.className = 'forecast-temperatures';
        const low = document.createElement('span');
        low.className = 'forecast-low';
        low.textContent = ' / ' + weatherValue(daily.temperature_2m_min?.[i], '°');
        temperatures.append(weatherValue(daily.temperature_2m_max?.[i], '°'), low);
        row.append(day, condition, temperatures);
        rows.push(row);
      }
      list.replaceChildren(...rows);
      if (rows.length < 3) {
        const message = document.createElement('li');
        message.className = 'panel-source';
        message.textContent = rows.length ? 'Some forecast days are unavailable.' : 'Forecast unavailable.';
        list.append(message);
      }
    }
    async function refreshWeather() {
      if (weatherLoading) return;
      weatherLoading = true;
      weatherData.setAttribute('aria-busy', 'true');
      weatherStatus.textContent = 'Checking weather…';
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 15000);
      try {
        const response = await fetch(weatherEndpoint, { signal: controller.signal, credentials: 'omit', referrerPolicy: 'no-referrer' });
        if (!response.ok) throw new Error('Weather unavailable');
        const data = await response.json();
        const current = data.current;
        if (!current || !Number.isFinite(current.temperature_2m) || !Number.isFinite(current.time)) throw new Error('Invalid weather');
        document.getElementById('weather-temp').textContent = weatherValue(current.temperature_2m, '°C');
        document.getElementById('weather-condition').textContent = weatherDescription(current.weather_code);
        document.getElementById('weather-feels').textContent = 'Feels like ' + weatherValue(current.apparent_temperature, '°C');
        renderForecast(data.daily);
        weatherTime = new Date(current.time * 1000);
        weatherChecked = Date.now();
        weatherStatus.textContent = (weatherChecked - weatherTime.getTime() > 2 * 60 * 60 * 1000 ? 'Older data · ' : 'As of ') + weatherTimeFormat.format(weatherTime) + ' IST';
      } catch {
        weatherStatus.textContent = weatherTime ? 'Could not refresh. Showing weather from ' + weatherTimeFormat.format(weatherTime) + ' IST.' : 'Weather unavailable. Check your internet connection or use the page refresh icon.';
        if (!weatherTime) {
          document.getElementById('weather-condition').textContent = 'Unavailable';
          renderForecast(null);
        }
      } finally {
        clearTimeout(timeout);
        weatherLoading = false;
        weatherData.setAttribute('aria-busy', 'false');
      }
    }
    refreshWeather();
    setInterval(() => { if (!document.hidden) refreshWeather(); }, 15 * 60 * 1000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - weatherChecked >= 15 * 60 * 1000) refreshWeather(); });
  </script>
</body>
</html>
